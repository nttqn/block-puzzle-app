name: block_puzzle
description: "Block Puzzle Plus - drag wooden blocks onto a grid, clear rows and columns for points."
publish_to: 'none'
version: 1.0.4+7

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.2.3
  # Pinned: 2.5.0 (2026-10-17, Pigeon JNI rewrite) hangs getInstance() in
  # real-device release builds — saves silently never persist. 2.4.28 is the
  # last pre-JNI release. Test a real release APK on a device before unpinning.
  shared_preferences_android: 2.4.28
  flame_audio: ^2.12.2
  games_services: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/title/title.png
    - assets/blocks/
    - assets/backgrounds/bg.png
    - assets/audio/sfx_paint.wav
    - assets/audio/sfx_stick.wav
    - assets/audio/sfx_explosive.wav
    - assets/audio/sfx_menu_confirm.wav
    - assets/audio/sfx_menu_back.wav
    - assets/audio/m_failed.mp3
    - assets/audio/bgm_menu.wav
    - assets/audio/bgm_game.wav

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
